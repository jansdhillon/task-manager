name: Build and Deploy to GCP
on:
    workflow_dispatch:
    push:
        branches: 
            - main
jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v3'
      - name: 'Google auth'
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          create_credentials_file: true
          workload_identity_provider: '${{ vars.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          project_id: '${{ vars.GCP_PROJECT_ID }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Login to GCP
        run: gcloud auth login --cred-file=${{steps.auth.outputs.credentials_file_path}}
      - name: Authenticate Docker with GHCR
        run: |-
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build Docker Image
        run: |
          docker buildx build \
            -t ghcr.io/jansdhillon/${{ vars.ARTIFACT_REPO }}:latest \
            .

      - name: Push Docker Image to GCR
        run: docker push ghcr.io/jansdhillon/${{ vars.ARTIFACT_REPO }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.SERVICE_NAME }} \
            --image ghcr.io/jansdhillon/${{ vars.ARTIFACT_REPO }}:latest \
            --region ${{ vars.REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated
